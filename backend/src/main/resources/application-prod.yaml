# Configurazione specifica per l'ambiente di produzione (prod)
spring:
  application:
    name: sio-backend # Nome identificativo del servizio

  datasource:
    url: jdbc:postgresql://localhost:5432/sio_db?currentSchema=sio # URL di connessione al database PostgreSQL
    username: sio_user # Nome utente del database
    password: sio_password # Password del database
    driver-class-name: org.postgresql.Driver # Driver JDBC per PostgreSQL
  jpa:
    show-sql: false # Disabilita la stampa delle query SQL per motivi di sicurezza e performance
    hibernate:
      ddl-auto: validate # Valida la coerenza dello schema del database rispetto alle entità JPA

# Configurazione della porta del server
server:
  port: 8080

# Configurazione restrittiva dei log per l'ambiente produttivo
logging:
  level:
    root: warn # Livello root impostato su WARN per limitare i log superflui
    com.sio.backend: info # Livello INFO per il monitoraggio operativo del codice SIO