# Configurazione specifica per l'ambiente di test automatizzati
spring:
  application:
    name: sio-backend # Nome identificativo del servizio

  datasource:
    url: jdbc:postgresql://localhost:5432/sio_db?currentSchema=sio # Connessione PostgreSQL di test
    username: sio_user # Nome utente DB
    password: sio_password # Password DB
    driver-class-name: org.postgresql.Driver # Driver JDBC

  jpa:
    show-sql: true # Abilita la visualizzazione delle query SQL durante l'esecuzione dei test
    hibernate:
      ddl-auto: none # Nessuna alterazione automatica dello schema
    properties:
      hibernate:
        format_sql: false # Mantiene disattivata la formattazione estesa dell'SQL

# Configurazione della porta del server
server:
  port: 8080